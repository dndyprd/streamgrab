services:
  streamgrab:
    build: .
    image: streamgrab
    container_name: streamgrab-app
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - MAX_DURATION_SECONDS=${MAX_DURATION_SECONDS:-1200}
      - PORT=${PORT:-5000}
    volumes:
      - ./downloads:/app/downloads
      - ./templates:/app/templates
      - ./static:/app/static
      - ./app.py:/app/app.py
      - ./downloader.py:/app/downloader.py
    restart: unless-stopped