services:
  streamgrab:
    build: .
    image: streamgrab
    container_name: streamgrab-app
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./templates:/app/templates
      - ./static:/app/static
      - ./app.py:/app/app.py
      - ./downloader.py:/app/downloader.py
    restart: unless-stopped